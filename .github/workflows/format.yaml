name: Auto Format

on:
  push:
    branches: [ main ] # Cambia 'main' por tu rama principal si es necesario

permissions:
  contents: write # Necesario para que el bot pueda guardar los cambios

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Ejecutar Prettier
        uses: creyD/prettier_action@v4.5
        with:
          prettier_options: --write **/*.{js,ts,jsx,tsx,json,css,md}
          commit_message: "style: formato automático con Prettier"
