name: Actualizar Tasas de Cambio

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC = 6:00 AM Bogotá
  workflow_dispatch:     # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  actualizar-tasas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar actualización en Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: node scripts/actualizar-tasas.mjs