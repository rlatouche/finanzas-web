<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Gestión Financiera</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      max-width: 400px;
      width: 100%;
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>

  <div class="card login-card p-4">
    <div class="text-center mb-4">
      <h4 class="fw-bold text-primary mb-1">Gestión Financiera</h4>
      <p class="text-muted small">Acceso privado al sistema</p>
    </div>

    <div id="alertaError" class="alert alert-danger d-none small" role="alert"></div>

    <form id="formLogin">
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold">Correo electrónico</label>
        <input type="email" class="form-control" id="email" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold">Contraseña</label>
        <input type="password" class="form-control" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" id="btnEntrar" class="btn btn-primary w-100 fw-semibold">
        Entrar
      </button>
    </form>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { iniciarSesion } from './js/auth.js';

    // Si ya tiene sesión activa, redirigir directo al panel
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('formLogin');
    const alerta = document.getElementById('alertaError');
    const btn = document.getElementById('btnEntrar');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alerta.classList.add('d-none');
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        await iniciarSesion(email, password);
        window.location.href = 'index.html';
      } catch (err) {
        alerta.textContent = 'Credenciales incorrectas o usuario no autorizado.';
        alerta.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
